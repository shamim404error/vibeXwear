<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#242830" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#101114" stop-opacity="1"/>
    </radialGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <linearGradient id="foldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="50%" stop-color="#000000" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
  </defs>

  <!-- Background Studio Backdrop -->
  <rect width="600" height="700" fill="url(#bgGrad)"/>
  
  <!-- Subtle Studio Grid Pattern -->
  <g opacity="0.12" stroke="#ffffff" stroke-width="0.5">
    <line x1="100" y1="0" x2="100" y2="700"/>
    <line x1="200" y1="0" x2="200" y2="700"/>
    <line x1="300" y1="0" x2="300" y2="700"/>
    <line x1="400" y1="0" x2="400" y2="700"/>
    <line x1="500" y1="0" x2="500" y2="700"/>
    <line x1="0" y1="150" x2="600" y2="150"/>
    <line x1="0" y1="350" x2="600" y2="350"/>
    <line x1="0" y1="550" x2="600" y2="550"/>
  </g>

  <!-- Brand watermark badge in background -->
  <text x="300" y="80" text-anchor="middle" fill="#ffffff" opacity="0.06" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="54" letter-spacing="12">VIBEXWEAR</text>

  <!-- T-Shirt Shadow Base -->
  <g filter="url(#softShadow)">
    <!-- T-Shirt Main Body Silhouette (Oversized Drop-Shoulder) -->
    <path d="M 230 115 
             C 260 145 340 145 370 115 
             L 480 155 
             L 535 275 
             L 470 305 
             L 440 245 
             L 440 600 
             C 440 610 430 618 420 618 
             L 180 618 
             C 170 618 160 610 160 600 
             L 160 245 
             L 130 305 
             L 65 275 
             L 120 155 
             Z" 
          fill="#0f1115"/>

    <!-- Fabric Shading Overlay -->
    <path d="M 230 115 
             C 260 145 340 145 370 115 
             L 480 155 
             L 535 275 
             L 470 305 
             L 440 245 
             L 440 600 
             C 440 610 430 618 420 618 
             L 180 618 
             C 170 618 160 610 160 600 
             L 160 245 
             L 130 305 
             L 65 275 
             L 120 155 
             Z" 
          fill="url(#foldGrad)"/>
  </g>

  <!-- Inner Neck Back Arc -->
  <path d="M 240 120 C 270 102 330 102 360 120 C 335 110 265 110 240 120 Z" fill="#000000"/>
  <!-- Woven Label on Neck -->
  <rect x="282" y="112" width="36" height="22" rx="2" fill="#0c0d0f"/>
  <rect x="284" y="114" width="32" height="4" fill="#ffffff"/>
  <text x="300" y="128" text-anchor="middle" fill="#ffffff" font-size="5" font-weight="700" letter-spacing="1">VX-L</text>

  <!-- Thick Ribbed Crewneck Collar -->
  <path d="M 230 115 C 265 152 335 152 370 115 C 362 138 238 138 230 115 Z" fill="#07080a" stroke="rgba(255,255,255,0.06)" stroke-width="1.5"/>

  <!-- Left & Right Sleeve Seam Accents -->
  <path d="M 175 220 L 160 245" stroke="#000000" stroke-width="2.5" opacity="0.6"/>
  <path d="M 425 220 L 440 245" stroke="#000000" stroke-width="2.5" opacity="0.6"/>
  <path d="M 120 155 L 180 230" stroke="rgba(0,0,0,0.25)" stroke-width="1.5"/>
  <path d="M 480 155 L 420 230" stroke="rgba(0,0,0,0.25)" stroke-width="1.5"/>

  <!-- Subtle Wrinkle Fold Highlights -->
  <path d="M 180 260 Q 210 280 230 300" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" fill="none"/>
  <path d="M 420 260 Q 390 280 370 300" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" fill="none"/>
  <path d="M 200 480 Q 240 500 280 495" stroke="rgba(0,0,0,0.2)" stroke-width="2" fill="none"/>
  <path d="M 400 475 Q 360 495 320 490" stroke="rgba(0,0,0,0.2)" stroke-width="2" fill="none"/>

  <!-- Streetwear Graphic Print on Chest -->
  <g transform="translate(195, 230)">
    <!-- Graphic Box Canvas -->
    <rect width="210" height="210" rx="8" fill="rgba(0,0,0,0.25)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    
    <!-- Accent Line / Technical mark -->
    <line x1="20" y1="20" x2="70" y2="20" stroke="#ffffff" stroke-width="3"/>
    <circle cx="190" cy="20" r="4" fill="#ffffff"/>
    
    <!-- Technical Spec Code -->
    <text x="20" y="42" fill="#d8ff00" opacity="0.6" font-family="'Courier New', monospace" font-size="9" letter-spacing="1">07 / LIMITED</text>

    <!-- Main Bold Streetwear Title -->
    <text x="20" y="80" fill="#d8ff00" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="20" letter-spacing="2">KINETIC ENERGY</text>
    
    <!-- Graphic Hero Artwork -->
    <rect x="20" y="95" width="170" height="60" rx="4" fill="#0c0d10"/>
    <text x="105" y="132" text-anchor="middle" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="12" letter-spacing="3">VIBEXWEAR INDUSTRIAL</text>
    
    <!-- Barcode Element -->
    <g transform="translate(20, 168)" fill="#d8ff00" opacity="0.75">
      <rect x="0" y="0" width="2" height="18"/>
      <rect x="5" y="0" width="3" height="18"/>
      <rect x="11" y="0" width="1" height="18"/>
      <rect x="15" y="0" width="4" height="18"/>
      <rect x="22" y="0" width="2" height="18"/>
      <rect x="27" y="0" width="1" height="18"/>
      <rect x="31" y="0" width="3" height="18"/>
      <rect x="37" y="0" width="2" height="18"/>
      <rect x="42" y="0" width="4" height="18"/>
      <rect x="49" y="0" width="1" height="18"/>
      <rect x="53" y="0" width="3" height="18"/>
      <rect x="59" y="0" width="2" height="18"/>
      <rect x="64" y="0" width="4" height="18"/>
    </g>

    <!-- Subtitle Spec -->
    <text x="190" y="180" text-anchor="end" fill="#d8ff00" opacity="0.6" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="7.5" letter-spacing="0.5">HIGH CONTRAST INDUSTRIAL EDITION</text>
  </g>

  <!-- Bottom Hem Stitch Line -->
  <line x1="165" y1="605" x2="435" y2="605" stroke="rgba(255,255,255,0.06)" stroke-width="1.5" stroke-dasharray="4,3"/>
  <!-- Woven Bottom Brand Tag -->
  <rect x="175" y="598" width="18" height="12" fill="#ffffff"/>
  <text x="184" y="607" text-anchor="middle" fill="#000000" font-size="5" font-weight="900">VX</text>

  <!-- Quality Stamp Label -->
  <g transform="translate(470, 50)">
    <circle cx="20" cy="20" r="22" fill="#14161a" stroke="#ffffff" stroke-width="1.5"/>
    <text x="20" y="16" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="7" font-weight="700">HEAVY</text>
    <text x="20" y="27" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="900">240G</text>
  </g>
</svg>